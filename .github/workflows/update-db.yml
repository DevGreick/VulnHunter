name: Update vulnerability database

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VulnHunter
        run: pip install -e .

      - name: Build OSV database
        run: vulnhunter db update --all --source osv --db vulnhunter.db

      - name: Build NVD database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            vulnhunter db update --source nvd --nvd-api-key "$NVD_API_KEY" --db vulnhunter.db
          else
            echo "NVD_API_KEY not set, skipping NVD"
          fi

      - name: Compress database
        run: gzip -9 -k vulnhunter.db

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete db-latest --yes 2>/dev/null || true
          gh release create db-latest \
            --title "Vulnerability Database (latest)" \
            --notes "Auto-generated vulnerability database. Updated $(date -u +%Y-%m-%d)." \
            --prerelease \
            vulnhunter.db.gz
