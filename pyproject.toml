[project]
name = "vulnhunter"
version = "2.0.0"
description = "Offline vulnerability scanner with AI triage — your dependencies have secrets, VulnHunter finds them."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "DevGreick"}]
keywords = ["security", "cve", "vulnerability", "scanner", "offline", "sbom", "sca", "devsecops", "osv", "nvd", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.9.0,<1.0",
    "rich>=13.0.0,<14.0",
    "pydantic>=2.0.0,<3.0",
    "packaging>=23.0,<25.0",
    "requests>=2.31.0,<3.0",
    "defusedxml>=0.7.1,<1.0",
    "keyring>=25.0.0,<26.0",
    "openpyxl>=3.1.0,<4.0",
]

[project.urls]
Homepage = "https://devgreick.github.io/VulnHunter/"
Repository = "https://github.com/DevGreick/VulnHunter"
Documentation = "https://devgreick.github.io/VulnHunter/"
Issues = "https://github.com/DevGreick/VulnHunter/issues"
Changelog = "https://github.com/DevGreick/VulnHunter/releases"

[project.optional-dependencies]
semgrep = [
    "semgrep>=1.50.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
vulnhunter = "vulnhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnhunter"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/vulnhunter/cli.py" = ["B008"]
"src/vulnhunter/parsers/base.py" = ["S603"]
"src/vulnhunter/onboarding.py" = ["S603", "S607"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
